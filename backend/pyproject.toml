[project]
name = "sylvar-backend"
version = "0.1.0"
requires-python = ">=3.11"
# Ranges follow MEMORY.md; exact versions UNVERIFIED until installed and locked.
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic[email]>=2.6",
  "pydantic-settings>=2.2",
  "pyjwt[crypto]>=2.8",
  "httpx>=0.27",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "greenlet>=3.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.0",
  "defusedxml>=0.7.1",
  "pillow>=10.0",
  "google-genai>=2.3.0",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "mypy>=1.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
